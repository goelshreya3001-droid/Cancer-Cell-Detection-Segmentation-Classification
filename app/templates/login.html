{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">Login</h2>
        <div id="loginError" class="alert alert-danger hidden"></div>
        <form id="loginForm">
            <div class="form-group">
                <label class="form-label" for="loginUsername">Username</label>
                <input class="form-input" type="text" id="loginUsername" required autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label" for="loginPassword">Password</label>
                <input class="form-input" type="password" id="loginPassword" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>
        <p class="text-center text-muted" style="margin-top:1rem;">
            Don't have an account? <a href="{{ url_for('ui.signup') }}">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}

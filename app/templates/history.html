{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1 class="page-title">Analysis History</h1>
    <p class="page-subtitle">Your previous analyses</p>
</div>

<div id="historyLoading" class="loading-state">
    <div class="loading-spinner"></div>
    <p class="loading-text">Loading history...</p>
</div>

<div id="historyError" class="alert alert-danger hidden"></div>

<div id="historyEmpty" class="empty-state hidden">
    <p>No analyses found. Start by analyzing an image.</p>
    <a href="{{ url_for('ui.analyze') }}" class="btn btn-primary">🔬 New Analysis</a>
</div>

<div id="historyTable" class="table-container hidden">
    <table class="data-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Filename</th>
                <th>Total Nuclei</th>
                <th>Malignant</th>
                <th>Time (s)</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="historyBody"></tbody>
    </table>
</div>

<div class="quick-actions" style="margin-top:1.5rem;">
    <a href="{{ url_for('ui.analyze') }}" class="btn btn-primary">🔬 New Analysis</a>
</div>
{% endblock %}

{% extends "base.html" %}
{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2 class="auth-title">Create Account</h2>
        <div id="signupError" class="alert alert-danger hidden"></div>
        <div id="signupSuccess" class="alert alert-success hidden"></div>
        <form id="signupForm">
            <div class="form-group">
                <label class="form-label" for="signupUsername">Username</label>
                <input class="form-input" type="text" id="signupUsername" required minlength="3" autocomplete="username">
            </div>
            <div class="form-group">
                <label class="form-label" for="signupEmail">Email <span class="text-muted">(optional)</span></label>
                <input class="form-input" type="email" id="signupEmail" autocomplete="email">
            </div>
            <div class="form-group">
                <label class="form-label" for="signupPassword">Password</label>
                <input class="form-input" type="password" id="signupPassword" required minlength="4" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label class="form-label" for="signupConfirm">Confirm Password</label>
                <input class="form-input" type="password" id="signupConfirm" required autocomplete="new-password">
            </div>
            <button type="submit" class="btn btn-primary btn-full">Create Account</button>
        </form>
        <p class="text-center text-muted" style="margin-top:1rem;">
            Already have an account? <a href="{{ url_for('ui.login') }}">Login</a>
        </p>
    </div>
</div>
{% endblock %}

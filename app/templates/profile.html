{% extends "base.html" %}
{% block content %}
<div class="page-header">
    <h1 class="page-title">My Profile</h1>
</div>

<div class="card">
    <div class="card-header"><h3>Account Information</h3></div>
    <div class="card-body">
        <div id="profileLoading" class="loading-state">
            <p class="loading-text">Loading profile...</p>
        </div>
        <div id="profileInfo" class="profile-info hidden">
            <div class="profile-row">
                <span class="profile-label">Username</span>
                <span class="profile-value" id="profileUsername">–</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Email</span>
                <span class="profile-value" id="profileEmail">–</span>
            </div>
            <div class="profile-row">
                <span class="profile-label">Member Since</span>
                <span class="profile-value" id="profileCreated">–</span>
            </div>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header"><h3>Actions</h3></div>
    <div class="card-body">
        <button id="profileLogout" class="btn btn-danger">Logout</button>
    </div>
</div>
{% endblock %}
